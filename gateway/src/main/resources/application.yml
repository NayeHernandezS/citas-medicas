server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    loadbalancer:
      enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: medicos
              uri: lb://medicos
              predicates:
                - Path=/api/medicos/**
              filters:
                - StripPrefix=2

            - id: pacientes
              uri: lb://pacientes
              predicates:
                - Path=/api/pacientes/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
